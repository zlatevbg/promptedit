x-app: &app
    build:
        context: .
        dockerfile: docker/Dockerfile
    image: promptedit-app
    volumes:
        - .:/app
    depends_on:
        mysql:
            condition: service_healthy

services:
    app:
        <<: *app
        environment:
            SERVER_NAME: ':8000'
        ports:
            - '8000:8000'

    worker:
        <<: *app
        command: php artisan queue:listen --tries=0 --timeout=60

    scheduler:
        <<: *app
        command: php artisan schedule:work

    vite:
        <<: *app
        command: sh -c "npm install && npm run dev"
        ports:
            - '5173:5173'

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: promptedit
            MYSQL_USER: promptedit
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
        ports:
            - '3306:3306'
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-psecret']
            interval: 5s
            retries: 20

    # Only lets /webhooks/pixelforge through to the app; the tunnel points here.
    webhook-proxy:
        image: caddy:2-alpine
        volumes:
            - ./docker/tunnel.Caddyfile:/etc/caddy/Caddyfile:ro
        depends_on:
            - app

    # Public URL for Pixelforge webhooks: `docker compose logs tunnel | grep trycloudflare`
    tunnel:
        image: cloudflare/cloudflared:latest
        command: tunnel --no-autoupdate --url http://webhook-proxy:8080
        depends_on:
            - webhook-proxy

volumes:
    mysql:
